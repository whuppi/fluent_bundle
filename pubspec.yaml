name: fluent_bundle
version: 0.1.0
description: >-
  Project Fluent (Mozilla's localization system) for Dart. Real
  per-language plural and gender rules, a choice of formatting backend,
  and inline markup. Pure Dart.
homepage: https://github.com/whuppi/fluent_bundle
repository: https://github.com/whuppi/fluent_bundle
issue_tracker: https://github.com/whuppi/fluent_bundle/issues

topics:
  - i18n
  - localization
  - fluent
  - l10n
  - intl

# Dev-time CLI. Two invocation modes both work:
#   * From a dependent project: `dart run fluent_bundle:watch` (auto-resolves
#     to `bin/watch.dart`).
#   * Globally installed:        `dart pub global activate fluent_bundle`.
executables:
  watch:

environment:
  sdk: ^3.7.0

# Pure Dart on purpose — no Flutter SDK, no plugins, no language data. The
# base package; the add-on packages provide formatting backends (fluent_intl,
# fluent_icu), code generation (fluent_gen), and Flutter support (fluent_flutter).
dependencies:
  # HTML5-conformant parser for the inline-markup feature in
  # `package:fluent_bundle/markup.dart`. Pure Dart, the Dart team's
  # verified-publisher port of html5lib-python.
  html: ^0.15.0

  # Annotations (@immutable, @visibleForTesting)
  meta: ^1.16.0

dev_dependencies:
  # Lint rules
  lints: ">=5.0.0 <7.0.0"

  # Test runner — the VM and Chrome lanes both execute under `dart test`
  test: ^1.25.0
