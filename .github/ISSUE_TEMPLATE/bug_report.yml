name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Describe the bug. Include the FTL, the call, the output you got, and any recorded FluentError.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Given this FTL: ...
        2. Calling: ...
        3. Expected ... but got ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Parsing (syntax barrel)
        - Resolving / formatting
        - Selectors / plurals
        - NUMBER / DATETIME
        - Markup spans
        - Locale negotiation / chains
        - Errors
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fluent_bundle version
      placeholder: e.g. 0.1.0
    validations:
      required: true
