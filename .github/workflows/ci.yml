# CI — every PR. Fast gate: each job runs a Makefile target through the
# shared make-target action, so the same commands run locally. Format runs
# inside `analyze` (resolve-first, diff-fails-under-CI). Runner-agnostic —
# all jobs run on one configurable runner (default ubuntu).
name: CI

on:
  pull_request:
    branches: [prod, dev]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner for all jobs"
        type: choice
        options: [ubuntu-24.04, macos-14, windows-2025-vs2026]
        default: ubuntu-24.04

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEFAULT_RUNNER: ubuntu-24.04

jobs:
  inputs:
    name: Resolve inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - id: resolve
        shell: bash
        env:
          OVERRIDE: ${{ inputs.runner }}
          DEFAULT: ${{ env.DEFAULT_RUNNER }}
        run: echo "runner=${OVERRIDE:-$DEFAULT}" >> "$GITHUB_OUTPUT"

  changes:
    name: Detect changes
    needs: inputs
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    permissions:
      contents: read  # checkout + paths-filter, read-only
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'bin/**'
              - 'test/**'
              - 'example/**'
              - 'tool/**'
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'Makefile'
              - '.github/**'

  analyze:
    name: Analyze
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: analyze

  analyze-floor:
    name: Analyze (floor deps)
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: analyze-floor

  platforms:
    name: Platform support
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: platforms

  test-guards:
    name: Test guards
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: test-guards

  test:
    name: Package tests (VM)
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: test

  test-web:
    name: Web tests (Chrome)
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: test-web
          chrome: 'true'
          headless-display: 'true'

  test-example:
    name: Example showcase
    needs: [inputs, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: whuppi/ci/actions/make-target@v2.0.5
        with:
          make-target: test-example

  gate:
    name: CI Gate
    if: always()
    needs: [inputs, changes, analyze, analyze-floor, platforms, test-guards, test, test-web, test-example]
    runs-on: ${{ needs.inputs.outputs.runner }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ANALYZE: ${{ needs.analyze.result }}
          ANALYZE_FLOOR: ${{ needs.analyze-floor.result }}
          PLATFORMS: ${{ needs.platforms.result }}
          TEST_GUARDS: ${{ needs.test-guards.result }}
          TEST: ${{ needs.test.result }}
          TEST_WEB: ${{ needs.test-web.result }}
          TEST_EXAMPLE: ${{ needs.test-example.result }}
        run: |
          # A failed (not skipped) changes job clears its outputs, so CODE
          # arrives empty — which must NOT read as "doc-only". Gate on the job
          # result before trusting its output.
          if [[ "$CHANGES" != "success" ]]; then
            echo "FAILED: change detection did not succeed (changes=$CHANGES)"
            exit 1
          fi
          if [[ "$CODE" != "true" ]]; then
            echo "Doc-only PR — CI gate passes"
            exit 0
          fi
          if [[ "$ANALYZE" != "success" ]] || [[ "$ANALYZE_FLOOR" != "success" ]] || [[ "$PLATFORMS" != "success" ]] || [[ "$TEST_GUARDS" != "success" ]] || [[ "$TEST" != "success" ]] || [[ "$TEST_WEB" != "success" ]] || [[ "$TEST_EXAMPLE" != "success" ]]; then
            echo "FAILED: analyze=$ANALYZE analyze-floor=$ANALYZE_FLOOR platforms=$PLATFORMS test-guards=$TEST_GUARDS test=$TEST test-web=$TEST_WEB test-example=$TEST_EXAMPLE"
            exit 1
          fi
          echo "All CI checks passed"
